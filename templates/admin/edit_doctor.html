{% extends 'base.html' %}

{% block title %}Edit Doctor - Admin HMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card">
            <h3 class="fw-bold mb-4"><i class="fas fa-edit text-info me-2"></i> Edit Doctor Info</h3>
            <form method="POST" action="{{ url_for('admin.edit_doctor', id=doctor.id) }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Doctor Specialization</label>
                        <select name="Doctorspecialization" class="form-select" required>
                            {% for spec in specs %}
                                <option value="{{ spec.specilization }}" {% if doctor.specilization == spec.specilization %}selected{% endif %}>{{ spec.specilization }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Doctor Name</label>
                        <input type="text" name="docname" class="form-control" value="{{ doctor.doctorName }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Clinic Address</label>
                        <input type="text" name="clinicaddress" class="form-control" value="{{ doctor.address }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Consultancy Fee ($)</label>
                        <input type="text" name="docfees" class="form-control" value="{{ doctor.docFees }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Contact Number</label>
                        <input type="tel" name="doccontact" class="form-control" value="{{ doctor.contactno }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Doctor Email (Read-only)</label>
                        <input type="email" class="form-control bg-light" value="{{ doctor.docEmail }}" readonly>
                    </div>
                </div>
                <button type="submit" class="btn btn-info text-white btn-custom w-100 py-2 mt-4"><i class="fas fa-save me-2"></i> Update Doctor Details</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
