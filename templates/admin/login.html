{% extends 'base.html' %}

{% block title %}Admin Login - HMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fas fa-user-shield text-warning" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mt-2">Administrator Panel</h3>
                <p class="text-muted">Sign in with master admin credentials</p>
            </div>
            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold"><i class="fas fa-user me-1"></i> Admin Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label font-weight-bold"><i class="fas fa-lock me-1"></i> Admin Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-warning text-dark font-weight-bold btn-custom w-100 py-2"><i class="fas fa-shield-alt me-2"></i> Admin Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
