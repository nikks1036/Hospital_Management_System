{% extends 'base.html' %}

{% block title %}Add Doctor - Admin HMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card">
            <h3 class="fw-bold mb-4"><i class="fas fa-user-md text-info me-2"></i> Register New Doctor</h3>
            <form method="POST" action="{{ url_for('admin.add_doctor') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Doctor Specialization</label>
                        <select name="Doctorspecialization" class="form-select" required>
                            <option value="">Select Specialization</option>
                            {% for spec in specializations %}
                                <option value="{{ spec.specilization }}">{{ spec.specilization }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Doctor Name</label>
                        <input type="text" name="docname" class="form-control" placeholder="Dr. Jane Smith" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Clinic / Hospital Address</label>
                        <input type="text" name="clinicaddress" class="form-control" placeholder="Clinic Address" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Consultancy Fee ($)</label>
                        <input type="text" name="docfees" class="form-control" placeholder="500" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Contact Number</label>
                        <input type="tel" name="doccontact" class="form-control" placeholder="Mobile Number" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Doctor Email</label>
                        <input type="email" name="docemail" class="form-control" placeholder="doctor@hospital.com" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label font-weight-bold">Password</label>
                        <input type="password" name="npass" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-info text-white btn-custom w-100 py-2 mt-4"><i class="fas fa-check-circle me-2"></i> Register Doctor Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
