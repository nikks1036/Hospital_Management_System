{% extends 'base.html' %}

{% block title %}CMS Contact Details - Admin HMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card">
            <h3 class="fw-bold mb-4"><i class="fas fa-address-book text-primary me-2"></i> Manage Contact Details</h3>
            <form method="POST" action="{{ url_for('admin.contact_us_cms') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Page Title</label>
                    <input type="text" name="pagetitle" class="form-control" value="{{ page.PageTitle if page else 'Contact Details' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Hospital Address</label>
                    <textarea name="pagedescription" rows="3" class="form-control" required>{{ page.PageDescription if page else '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Hospital Email</label>
                    <input type="email" name="email" class="form-control" value="{{ page.Email if page else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Mobile / Phone Number</label>
                    <input type="text" name="mobilenumber" class="form-control" value="{{ page.MobileNumber if page else '' }}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label font-weight-bold">Opening Hours / Timing</label>
                    <input type="text" name="timing" class="form-control" value="{{ page.OpenningTime if page else '9 am To 8 Pm' }}" required>
                </div>
                <button type="submit" class="btn btn-primary-custom btn-custom w-100 py-2"><i class="fas fa-save me-2"></i> Save Contact Info</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
