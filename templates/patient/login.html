{% extends 'base.html' %}

{% block title %}Patient Login - HMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fas fa-user-circle text-primary" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mt-2">Patient Login</h3>
                <p class="text-muted">Sign in to your patient account</p>
            </div>
            <form method="POST" action="{{ url_for('patient.login') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold"><i class="fas fa-envelope me-1"></i> Registered Email</label>
                    <input type="email" name="username" class="form-control form-control-lg" placeholder="e.g. patient@test.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label font-weight-bold"><i class="fas fa-lock me-1"></i> Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-custom btn-custom w-100 py-2"><i class="fas fa-sign-in-alt me-2"></i> Log In</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top">
                <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('patient.register') }}" class="text-primary fw-bold text-decoration-none">Register Here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
