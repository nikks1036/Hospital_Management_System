{% extends 'base.html' %}

{% block title %}Edit Profile - Patient HMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card">
            <h3 class="fw-bold mb-4"><i class="fas fa-user-edit text-primary me-2"></i> Edit Profile</h3>
            <form method="POST" action="{{ url_for('patient.edit_profile') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Full Name</label>
                    <input type="text" name="fname" class="form-control" value="{{ user.fullName }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Address</label>
                    <textarea name="address" rows="3" class="form-control" required>{{ user.address }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">City</label>
                    <input type="text" name="city" class="form-control" value="{{ user.city }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="male" {% if user.gender == 'male' %}selected{% endif %}>Male</option>
                        <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Female</option>
                        <option value="other" {% if user.gender == 'other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label font-weight-bold">User Email (Read-only)</label>
                    <input type="email" class="form-control bg-light" value="{{ user.email }}" readonly>
                </div>
                <button type="submit" class="btn btn-primary-custom btn-custom w-100 py-2"><i class="fas fa-save me-2"></i> Update Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
