{% extends 'base.html' %}

{% block title %}Patient Registration - HMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">Patient Registration</h3>
                <p class="text-muted">Create an account to book appointments</p>
            </div>
            <form method="POST" action="{{ url_for('patient.register') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">City</label>
                        <input type="text" name="city" class="form-control" placeholder="New York" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label font-weight-bold">Address</label>
                        <textarea name="address" rows="2" class="form-control" placeholder="Full residence address" required></textarea>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label font-weight-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary-custom btn-custom w-100 py-2 mt-4"><i class="fas fa-check-circle me-2"></i> Register Account</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-0">Already registered? <a href="{{ url_for('patient.login') }}" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
