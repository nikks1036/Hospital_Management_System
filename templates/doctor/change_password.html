{% extends 'base.html' %}

{% block title %}Doctor Change Password - HMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card">
            <h3 class="fw-bold mb-4"><i class="fas fa-key text-info me-2"></i> Doctor Change Password</h3>
            <form method="POST" action="{{ url_for('doctor.change_password') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Current Password</label>
                    <input type="password" name="cpass" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label class="form-label font-weight-bold">New Password</label>
                    <input type="password" name="npass" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-info text-white btn-custom w-100 py-2"><i class="fas fa-lock me-2"></i> Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
