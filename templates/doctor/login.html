{% extends 'base.html' %}

{% block title %}Doctor Login - HMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fas fa-user-md text-info" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mt-2">Doctor Portal Login</h3>
                <p class="text-muted">Sign in to manage patient care</p>
            </div>
            <form method="POST" action="{{ url_for('doctor.login') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold"><i class="fas fa-envelope me-1"></i> Doctor Email</label>
                    <input type="email" name="username" class="form-control form-control-lg" placeholder="anujk123@test.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label font-weight-bold"><i class="fas fa-lock me-1"></i> Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-info text-white btn-custom w-100 py-2"><i class="fas fa-sign-in-alt me-2"></i> Doctor Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
