{% extends 'base.html' %}

{% block title %}Edit Patient - Doctor HMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card">
            <h3 class="fw-bold mb-4"><i class="fas fa-edit text-primary me-2"></i> Edit Patient Details</h3>
            <form method="POST" action="{{ url_for('doctor.edit_patient', id=patient.ID) }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Patient Name</label>
                        <input type="text" name="patname" class="form-control" value="{{ patient.PatientName }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Contact Number</label>
                        <input type="tel" name="patcontact" class="form-control" value="{{ patient.PatientContno }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Patient Email</label>
                        <input type="email" name="patemail" class="form-control" value="{{ patient.PatientEmail }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label font-weight-bold">Age</label>
                        <input type="number" name="patage" class="form-control" value="{{ patient.PatientAge }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label font-weight-bold">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="male" {% if patient.PatientGender == 'male' %}selected{% endif %}>Male</option>
                            <option value="female" {% if patient.PatientGender == 'female' %}selected{% endif %}>Female</option>
                            <option value="other" {% if patient.PatientGender == 'other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label font-weight-bold">Address</label>
                        <textarea name="pataddress" rows="2" class="form-control" required>{{ patient.PatientAdd }}</textarea>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label font-weight-bold">Medical History</label>
                        <textarea name="medhis" rows="3" class="form-control">{{ patient.PatientMedhis }}</textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary-custom btn-custom w-100 py-2 mt-4"><i class="fas fa-save me-2"></i> Update Patient Details</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
